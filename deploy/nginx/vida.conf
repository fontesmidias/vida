# VIDA (desafio CLAVIS VIA) em vida.fontesmidias.com.br.
# Instalado em /etc/nginx/sites-available/vida na VPS. Fonte versionada: deploy/nginx/vida.conf.
#
# Mesmo padrão dos outros sites desta VPS: o contêiner publica a porta só em 127.0.0.1:8097,
# então este é o único caminho de entrada.
#
# Diferença deliberada (D22/D23): este site fica atrás do proxy do Cloudflare e só aceita
# conexões vindas dele. A restrição vale só aqui, e não no firewall, porque os outros
# subdomínios da VPS são dns-only e quebrariam. Entre Cloudflare e esta origem o tráfego é
# HTTPS com certificado válido (Configuration Rule "vida - SSL full strict").

server {
    listen 80;
    listen [::]:80;
    server_name vida.fontesmidias.com.br;

    # Renovação do certificado (HTTP-01). Fica fora da restrição de origem: o Let's Encrypt
    # chega pelo Cloudflare, mas a validação não pode depender disso.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... ssl http2` é a forma do nginx 1.18, que é a versão desta VPS.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vida.fontesmidias.com.br;

    ssl_certificate     /etc/letsencrypt/live/vida.fontesmidias.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vida.fontesmidias.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # S1 / D22: só o Cloudflare chega aqui. Faixas oficiais de https://www.cloudflare.com/ips
    # (conferidas em 2026-10-22; o Cloudflare raramente as muda, mas vale rever a cada trimestre).
    allow 173.245.48.0/20;
    allow 103.21.244.0/22;
    allow 103.22.200.0/22;
    allow 103.31.4.0/22;
    allow 141.101.64.0/18;
    allow 108.162.192.0/18;
    allow 190.93.240.0/20;
    allow 188.114.96.0/20;
    allow 197.234.240.0/22;
    allow 198.41.128.0/17;
    allow 162.158.0.0/15;
    allow 104.16.0.0/13;
    allow 104.24.0.0/14;
    allow 172.64.0.0/13;
    allow 131.0.72.0/22;
    allow 2400:cb00::/32;
    allow 2606:4700::/32;
    allow 2803:f800::/32;
    allow 2405:b500::/32;
    allow 2405:8100::/32;
    allow 2a06:98c0::/29;
    allow 2c0f:f248::/32;
    deny all;

    # S6: o app só recebe JSON pequeno (check-in, conclusão de dia)
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # O Next.js injeta scripts inline para hidratar a página; o resto só vem do próprio site.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # S7: a verificação com banco é só para o healthcheck interno do Docker.
    location = /api/health/ready {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;

        # O IP real do visitante vem em CF-Connecting-IP. Ele é confiável aqui porque só o
        # Cloudflare passa pelo allow acima. Sobrescrito, nunca acrescentado.
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
